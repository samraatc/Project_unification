version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      typescript:
        patterns: ['typescript', 'tslib', '@typescript-eslint/*']
      framer-and-motion:
        patterns: ['framer-motion', 'motion', 'gsap']
      next-stack:
        patterns: ['next', 'react', 'react-dom']
  - package-ecosystem: github-actions
    directory: '/'
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: '/apps/api'
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: '/apps/storefront'
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: '/infra/terraform/envs/dev'
    schedule: { interval: weekly }
