# Local development stack for the Unified Platform.
# Mongo replica set is required by Mongoose transactions (TRD §1) and CSFLE (TRD §5).
# Redis backs sessions, BullMQ queues, RBAC permission cache, rate limit (TRD §1).

services:
  mongo:
    image: mongo:7.0
    container_name: unified-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/docker/mongo-init-rs.sh:/scripts/mongo-init-rs.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7.0
    container_name: unified-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "/scripts/mongo-init-rs.sh"]
    volumes:
      - ./infra/docker/mongo-init-rs.sh:/scripts/mongo-init-rs.sh:ro
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: unified-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailhog:
    # Local SMTP capture for transactional email during dev.
    image: mailhog/mailhog:latest
    container_name: unified-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    # S3-compatible local object store for media uploads.
    image: minio/minio:latest
    container_name: unified-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  minio-data:
