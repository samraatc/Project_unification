replicaCount: 2

image:
  repository: ghcr.io/samraatc/unified-storefront
  tag: "0.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

containerPort: 3000

env:
  NODE_ENV: production

envFromSecret: unified-storefront-secrets

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 750m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: true
  className: nginx
  host: shop.dev.unified.example.com
  tls: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
